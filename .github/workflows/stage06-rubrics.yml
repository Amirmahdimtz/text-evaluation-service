name: Stage06 isolated rubric versioning validation

on:
  push:
    branches: [main]
    paths:
      - "src/infrastructure/**"
      - "scripts/verification/run_stage05_migrations.py"
      - "tests/test_stage05_*.py"
      - "requirements*.txt"
      - "src/core/services/text_evaluation/rubric_*.py"
      - "tests/test_stage06_*.py"
      - "tests/fixtures/stage06_candidate_rubrics.json"
      - ".github/workflows/stage06-rubrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  isolated-postgres:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: tes_stage05_ci
          POSTGRES_USER: tes_stage05_ci
          POSTGRES_PASSWORD: synthetic_ci_only_password
        ports:
          - "5432:5432"
        options: >-
          --health-cmd="pg_isready -U tes_stage05_ci -d tes_stage05_ci"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=12
    env:
      TES_ENVIRONMENT: development
      TES_STAGE05_DATABASE_URL: postgresql+asyncpg://tes_stage05_ci:synthetic_ci_only_password@127.0.0.1:5432/tes_stage05_ci
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned public-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Compile and run offline schema/security regressions
        run: |
          python -m compileall -q src tests scripts
          python -m pytest -q -p no:cacheprovider tests/test_stage05_schema.py
          python scripts/verification/check_stage04_safety.py
      - name: Run actual PostgreSQL migration
        run: python -m scripts.verification.run_stage05_migrations upgrade
      - name: Compare migrated PostgreSQL schema to ORM metadata
        run: python -m scripts.verification.run_stage05_migrations check
      - name: Validate Stage06 synthetic rubric contracts
        run: python -m pytest -q -p no:cacheprovider tests/test_stage06_rubric_schema.py
      - name: Run real Stage06 publication race and immutable version tests
        run: python -m pytest -q -p no:cacheprovider tests/test_stage06_rubric_postgres.py
      - name: Run existing Stage05 real PostgreSQL integration suite
        run: python -m pytest -q -p no:cacheprovider tests/test_stage05_postgres.py
      - name: Run Stage02 and Stage03 regression suites
        run: |
          python -m unittest discover -s scripts/benchmark -p 'test_*.py' -q
          python -m unittest discover -s scripts/verification -p 'test_check_stage02_docs.py' -q
          python -m pip check
      - name: Run complete existing Python regression suite
        run: python -m pytest -q -p no:cacheprovider tests
      - name: Audit public development dependencies against OSV
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: pip-audit==2.10.1
          python -m pip_audit --local --strict --vulnerability-service osv --progress-spinner off --desc off --timeout 30
