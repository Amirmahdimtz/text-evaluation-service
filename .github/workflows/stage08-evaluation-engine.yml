name: Stage08 synthetic evaluation engine tests

on:
  push:
    branches: [main]
    paths:
      - "src/core/services/text_evaluation/text_preprocessing_service.py"
      - "src/core/services/text_evaluation/criterion_evaluation_service.py"
      - "src/core/services/text_evaluation/scoring_service.py"
      - "src/core/services/text_evaluation/text_evaluation_service.py"
      - "src/infrastructure/providers/llm/local_llm_provider.py"
      - "tests/test_stage08_*.py"
      - ".github/workflows/stage08-evaluation-engine.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-engine:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      TES_ENVIRONMENT: development
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned public-only dependencies
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Compile and static security guard
        run: |
          python -m compileall -q src tests
          python scripts/verification/check_stage04_safety.py
      - name: Run Stage08 deterministic engine contract tests
        run: python -m pytest -q -p no:cacheprovider tests/test_stage08_engine.py
      - name: Run complete offline Python regressions
        run: python -m pytest -q -p no:cacheprovider tests --ignore=tests/test_stage05_postgres.py --ignore=tests/test_stage06_rubric_postgres.py
      - name: Stage02 and Stage03 regressions and dependency consistency
        run: |
          python -m unittest discover -s scripts/benchmark -p 'test_*.py' -q
          python -m unittest discover -s scripts/verification -p 'test_check_stage02_docs.py' -q
          python -m pip check
