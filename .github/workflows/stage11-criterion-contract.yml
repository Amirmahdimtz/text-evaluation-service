name: Stage11 real-criterion-contract offline verification

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification/stage11_criterion_contract_smoke.py"
      - "tests/test_stage11_criterion_contract_smoke.py"
      - "src/infrastructure/providers/llm/structured_response.py"
      - "scripts/verification/stage11_synthetic_inference_smoke.py"
      - ".github/workflows/stage11-criterion-contract.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  criterion-contract-offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned public-only dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Verify application criterion schema and HTTP safety with synthetic mocks only
        run: python -m pytest -q -p no:cacheprovider tests/test_stage11_criterion_contract_smoke.py tests/test_stage11_synthetic_inference_smoke.py
      - name: Verify direct script-path CLI in isolated mode (no network)
        run: python -I -B scripts/verification/stage11_criterion_contract_smoke.py > /dev/null
      - name: Verify module-mode CLI (no network)
        run: python -B -m scripts.verification.stage11_criterion_contract_smoke > /dev/null
