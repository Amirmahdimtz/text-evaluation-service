name: Stage11 host-inventory script offline safety checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification/stage11_readonly_preflight.py"
      - "tests/test_stage11_readonly_preflight.py"
      - "scripts/verification/stage11_container_metadata.py"
      - "tests/test_stage11_container_metadata.py"
      - "scripts/verification/stage11_isolated_runtime_preflight.py"
      - "tests/test_stage11_isolated_runtime_preflight.py"
      - "compose.stage11-isolated-db.yml"
      - "tests/test_stage11_isolated_compose_contract.py"
      - "scripts/verification/stage11_real_model_criterion_probe.py"
      - "tests/test_stage11_real_model_criterion_probe.py"
      - "scripts/verification/stage11_vllm_diagnostics.py"
      - "tests/test_stage11_vllm_diagnostics.py"
      - "scripts/verification/stage11_vllm_phase_inventory.py"
      - "tests/test_stage11_vllm_phase_inventory.py"
      - "scripts/verification/stage11_output_budget.py"
      - "scripts/verification/stage11_structured_decoding_compare.py"
      - "tests/test_stage11_decoding_comparison.py"
      - "scripts/verification/stage11_guided_backend_inspect.py"
      - "tests/test_stage11_guided_backend_inspect.py"
      - "scripts/verification/stage11_xgrammar_cpu_profile.py"
      - "tests/test_stage11_xgrammar_cpu_profile.py"
      - "scripts/verification/stage11_xgrammar_tokenizer_profile.py"
      - "tests/test_stage11_xgrammar_tokenizer_profile.py"
      - "scripts/verification/stage11_serving_artifact_match.py"
      - "tests/test_stage11_serving_artifact_match.py"
      - "Dockerfile.stage11-candidate"
      - "requirements.txt"
      - "src/**"
      - "tests/test_stage11_candidate_image_contract.py"
      - "src/infrastructure/providers/llm/local_llm_provider.py"
      - "tests/test_stage07_local_llm.py"
      - ".github/workflows/stage11-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned development tests
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Run synthetic-only safety tests (not Simorgh GPU tests)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_stage11_readonly_preflight.py tests/test_stage11_container_metadata.py tests/test_stage11_isolated_runtime_preflight.py tests/test_stage11_isolated_compose_contract.py
      - name: Validate three-domain real-model probe offline guards (no network)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python -m pytest -q -p no:cacheprovider tests/test_stage11_real_model_criterion_probe.py tests/test_stage11_vllm_diagnostics.py tests/test_stage11_vllm_phase_inventory.py tests/test_stage11_decoding_comparison.py tests/test_stage11_guided_backend_inspect.py tests/test_stage11_xgrammar_cpu_profile.py tests/test_stage11_xgrammar_tokenizer_profile.py tests/test_stage11_serving_artifact_match.py tests/test_stage11_candidate_image_contract.py tests/test_stage07_local_llm.py
          python -m scripts.verification.stage11_vllm_phase_inventory
          python -m scripts.verification.stage11_real_model_criterion_probe
          python -m scripts.verification.stage11_output_budget
          python -m scripts.verification.stage11_structured_decoding_compare
          python -m scripts.verification.stage11_guided_backend_inspect
          python -m scripts.verification.stage11_xgrammar_cpu_profile
          python -m scripts.verification.stage11_xgrammar_tokenizer_profile
          python -m scripts.verification.stage11_serving_artifact_match
      - name: Offline import/CLI sanity without querying GPU
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verification/stage11_readonly_preflight.py --no-gpu > /dev/null
      - name: Offline container script dry-run (no Docker, no network)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verification/stage11_container_metadata.py --container synthetic-vllm > /dev/null

  stage11-candidate-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Build API-only engineering candidate (not deployment)
        run: |
          docker build --file Dockerfile.stage11-candidate --tag tes-stage11-api-candidate:ci .
      - name: Assert nonroot image startup is fail-closed without network
        run: |
          test "$(docker image inspect tes-stage11-api-candidate:ci --format '{{.Config.User}}')" = "10001:10001"
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --entrypoint python tes-stage11-api-candidate:ci -c '
          from src.host.app import app
          from src.infrastructure.utils.config_reader import ConfigReader
          config = ConfigReader()
          assert config.settings.server.host == "127.0.0.1"
          assert config.settings.http_security.enabled is False
          assert config.settings.llm.enabled is False
          assert config.settings.worker.enabled is False
          assert app.openapi_url is None
          print("IMAGE_IMPORT_FAIL_CLOSED_PASS")
          '
      - name: Exercise actual API health and disabled Worker in networkless container
        run: |
          docker run --rm --network none --read-only --cap-drop ALL \
            --security-opt no-new-privileges --pids-limit 64 --memory 512m \
            --entrypoint python tes-stage11-api-candidate:ci -c '
          import json
          import subprocess
          import sys
          import time
          from urllib.request import ProxyHandler, build_opener

          process = subprocess.Popen(
              [sys.executable, "-m", "src.host.app"],
              stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL,
          )
          try:
              opener = build_opener(ProxyHandler({}))
              success = False
              for _ in range(50):
                  if process.poll() is not None:
                      raise RuntimeError("STAGE11_API_EXITED_EARLY")
                  try:
                      with opener.open(
                          "http://127.0.0.1:18080/health/live",
                          timeout=1,
                      ) as response:
                          success = (
                              response.status == 200 and
                              json.load(response) == {"status": "alive"}
                          )
                          if success:
                              break
                  except OSError:
                      time.sleep(0.1)
              assert success, "STAGE11_API_NOT_READY"
              print("IMAGE_API_LOOPBACK_LIVENESS_PASS")
          finally:
              process.terminate()
              process.wait(timeout=5)

          worker = subprocess.run(
              [sys.executable, "-m", "src.host.evaluation_worker"],
              capture_output=True, text=True, check=False, timeout=10,
          )
          assert worker.returncode != 0
          assert "WORKER_DISABLED" in worker.stderr
          print("IMAGE_WORKER_DEFAULT_DENY_PASS")
          '
