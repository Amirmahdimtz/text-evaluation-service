name: Stage11 host-inventory script offline safety checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification/stage11_readonly_preflight.py"
      - "tests/test_stage11_readonly_preflight.py"
      - "scripts/verification/stage11_container_metadata.py"
      - "tests/test_stage11_container_metadata.py"
      - ".github/workflows/stage11-preflight.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-preflight-script:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned development tests
        run: python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Run synthetic-only safety tests (not Simorgh GPU tests)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_stage11_readonly_preflight.py tests/test_stage11_container_metadata.py
      - name: Offline import/CLI sanity without querying GPU
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verification/stage11_readonly_preflight.py --no-gpu > /dev/null
      - name: Offline container script dry-run (no Docker, no network)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verification/stage11_container_metadata.py --container synthetic-vllm > /dev/null
