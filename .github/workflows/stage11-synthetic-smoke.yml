name: Stage11 bounded synthetic inference smoke tooling offline checks

on:
  push:
    branches: [main]
    paths:
      - "scripts/verification/stage11_synthetic_inference_smoke.py"
      - "tests/test_stage11_synthetic_inference_smoke.py"
      - ".github/workflows/stage11-synthetic-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  synthetic-offline-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install pinned development dependencies
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: -r requirements-dev.txt
      - name: Run offline mock HTTP contract/safety checks (no model inference)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python -m pytest -q -p no:cacheprovider tests/test_stage11_synthetic_inference_smoke.py
      - name: Dry-run CLI (no network)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python scripts/verification/stage11_synthetic_inference_smoke.py --dry-run > /dev/null
